kind = "web"
previewPath = "/"
title = "Developer Utilities Toolkit"
version = "1.0.0"
id = "artifacts/dev-tools"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22666

[services.development]
run = "pnpm --filter @workspace/dev-tools run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dev-tools", "run", "build" ]
publicDir = "artifacts/dev-tools/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22666"
BASE_PATH = "/"
